name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      # Advisory only — NOT a required check. A stale or unreachable
      # test-checker checkout must never block an unrelated PR.
      - name: rule-id contract (advisory)
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/BaconDroid/test-checker.git ../test-checker
          TC_REPO=../test-checker npm run check:rule-ids
